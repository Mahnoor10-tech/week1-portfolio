<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me | Mahnoor Fatima</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container">

            <h1>Contact Me</h1>

            <p>Let's connect and talk</p>

        </div>

    </header>


    <!-- Navigation -->
    <nav class="navbar">

        <div class="container nav-container">

            <a href="index.html">Home</a>

            <a href="projects.html">Projects</a>

            <a href="contact.html" class="active">Contact</a>

        </div>

    </nav>


    <!-- Main -->
    <main>

        <section class="section">

            <div class="container">

                <div class="section-heading">

                    <span class="section-tag">GET IN TOUCH</span>

                    <h2>Send Me a Message</h2>

                    <p>
                        If you would like to contact me,
                        feel free to send a message.
                    </p>

                </div>


                <div class="contact-card">

                    <form class="contact-form">

                        <!-- Name -->
                        <div class="form-group">

                            <label for="name">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your name"
                                required
                            >

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- Message -->
                        <div class="form-group">

                            <label for="message">
                                Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="7"
                                placeholder="Write your message..."
                                required
                            ></textarea>

                        </div>


                        <!-- Submit -->
                        <button type="submit" class="submit-button">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <p>
                &copy; 2026 Mahnoor Fatima. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
